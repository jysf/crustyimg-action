name: self-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Exercises the full lint wrapper (install → JSON → annotations → exit) on all
  # three OSes, against both a pinned crustyimg release and `latest`.
  lint-wrapper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [v0.8.0, latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # A directory input lints only the files directly inside it, so the copy
      # in test-assets/nested/ is not part of this run.
      - name: Lint the GPS-leak fixture (must annotate + fail)
        id: lint
        continue-on-error: true
        uses: ./
        with:
          version: ${{ matrix.version }}
          paths: test-assets

      - name: Assert the lint failed (findings → non-zero)
        shell: bash
        run: |
          if [ "${{ steps.lint.outcome }}" != "failure" ]; then
            echo "expected the GPS-leak lint to fail, got '${{ steps.lint.outcome }}'"
            exit 1
          fi
          echo "GPS-leak lint failed as expected ✅"

      # The wrapper leaves its (path-rewritten) report in RUNNER_TEMP. Annotations
      # only attach to PR files when paths are workspace-relative with `/`.
      - name: Assert annotation paths are workspace-relative
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/crustyimg-lint.json"
          jq -r '.findings[].file' "$report"
          jq -e '[.findings[].file] == ["test-assets/gps-leak.jpg"]' "$report" >/dev/null
          echo "paths are relative ✅"

      - name: A recursive glob reaches nested files; fail-level=never stays green
        uses: ./
        with:
          version: ${{ matrix.version }}
          paths: test-assets/**/*
          fail-level: never

      - name: Assert the glob found the nested file
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/crustyimg-lint.json"
          jq -r '.findings[].file' "$report"
          jq -e '[.findings[].file] | sort == ["test-assets/gps-leak.jpg", "test-assets/nested/gps-leak.jpg"]' "$report" >/dev/null
          echo "glob reached test-assets/nested ✅"

  # Exercises the optimize mode (also proves the setup-crustyimg delegation).
  optimize-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize via the action
        uses: ./
        with:
          mode: optimize
          version: v0.8.0
          paths: test-assets/clean.png
          args: -o out.png
      - name: Optimized file exists
        shell: bash
        run: test -f out.png && echo "optimize produced $(wc -c < out.png) bytes"
